<!DOCTYPE html>
<html>
<head>
    <title>OwnDroid</title>
    <meta name="viewport" content="width=device-width">
    <meta charset="UTF-8">
    <script src="index.ts" type="module"></script>
</head>
<body>
    <div id="topbar">
        <a>OwnDroid</a>
        <button id="home-btn" class="m3 icon-button hidden">
            <icon name="home"/>
        </button>
        <logs-pager class="hidden">
            <button class="previous m3 icon-button" disabled>
                <icon name="keyboard_arrow_left"/>
            </button>
            <button class="page"></button>
            <button class="next m3 icon-button" disabled>
                <icon name="keyboard_arrow_right"/>
            </button>
            <dialog class="m3">
                <label data-i18n="page" for="page-input"></label>
                <input id="page-input" type="number" min="1" class="m3 outlined" required>
                <div class="buttons">
                    <button data-i18n="cancel" class="m3 tonal cancel"></button>
                    <button data-i18n="jump" class="m3 filled jump" disabled></button>
                </div>
            </dialog>
        </logs-pager>
        <div id="icons-row">
            <button id="open-filters-btn" class="hidden m3 icon-button">
                <icon name="filter"/>
            </button>
            <button id="open-settings-btn" class="m3 icon-button">
                <icon name="settings"/>
            </button>
        </div>
    </div>
    <div class="screen active" id="greeting-view">
        <h2>OwnDroid</h2>
        <p data-i18n="short_description"></p>
        <a href="https://github.com/BinTianqi/OwnDroid" data-i18n="project_homepage" target="_blank"></a>
        <h3 data-i18n="utilities">Utilities</h3>
        <input type="file" accept="application/json" class="hidden">
        <div class="entry security-logs">
            <a data-i18n="view_security_logs">View security logs</a>
            <button data-i18n="open_file" class="m3 filled">Open file</button>
        </div>
        <div class="entry network-logs">
            <a data-i18n="view_network_logs">View network logs</a>
            <button data-i18n="open_file" class="m3 filled">Open file</button>
        </div>
        <div class="entry qr-code">
            <span data-i18n="generate_qr_code">Generate QR code</span>
            <button class="m3 filled" data-i18n="start">Start</button>
        </div>
        <p data-i18n="utilities_run_locally" class="notice"></p>
    </div>
    <security-logs-screen class="screen">
        <table>
            <thead></thead>
            <tbody></tbody>
        </table>
        <security-logs-filter>
            <dialog class="m3">
                <div class="content">
                    <h2 data-i18n="filters">Filters</h2>
                    <h3 data-i18n="columns">Columns</h3>
                    <div class="columns"></div>
                    <h3 data-i18n="levels">Levels</h3>
                    <div class="levels">
                        <div>
                            <input type="checkbox" value="1" id="s-info-checkbox" class="m3">
                            <label for="s-info-checkbox">info<span></span></label>
                        </div>
                        <div>
                            <input type="checkbox" value="2" id="s-warning-checkbox" class="m3">
                            <label for="s-warning-checkbox">warning<span></span></label>
                        </div>
                        <div>
                            <input type="checkbox" value="3" id="s-error-checkbox" class="m3">
                            <label for="s-error-checkbox">error<span></span></label>
                        </div>
                    </div>
                    <h3 data-i18n="event_types">Event types</h3>
                    <div class="tags"></div>
                </div>
                <div class="buttons">
                    <button data-i18n="cancel" class="m3 tonal cancel">Cancel</button>
                    <button data-i18n="apply" class="m3 apply">Apply</button>
                </div>
            </dialog>
        </security-logs-filter>
    </security-logs-screen>
    <network-logs-screen class="screen">
        <table>
            <thead></thead>
            <tbody></tbody>
        </table>
        <network-logs-filter>
            <dialog class="m3">
                <h2 data-i18n="filters">Filters</h2>
                <h3 data-i18n="columns">Columns</h3>
                <div class="columns"></div>
                <h3 data-i18n="types">Types</h3>
                <div class="types">
                    <div>
                        <input type="checkbox" value="connect" id="n-connect-checkbox" class="m3">
                        <label for="n-connect-checkbox"><span data-i18n="connect"></span><span></span></label>
                    </div>
                    <div>
                        <input type="checkbox" value="dns" id="n-dns-checkbox" class="m3">
                        <label for="n-dns-checkbox">DNS<span></span></label>
                    </div>
                </div>
                <div class="buttons">
                    <button data-i18n="cancel" class="m3 tonal cancel">Cancel</button>
                    <button data-i18n="apply" class="m3 apply">Apply</button>
                </div>
            </dialog>
        </network-logs-filter>
    </network-logs-screen>
    <qr-code-screen class="screen" id="qr-code-view">
        <div class="link">
            <label for="apk-link-textarea">APK URL</label>
            <textarea id="apk-link-textarea" class="m3 outlined"></textarea>
        </div>
        <div class="testkey">
            <input type="checkbox" id="testkey-checkbox" class="m3 testkey">
            <label for="testkey-checkbox">testkey</label>
        </div>
        <button class="m3 generate" data-i18n="generate" disabled>Generate</button>
        <canvas width="300" height="300" class="hidden"></canvas>
    </qr-code-screen>
    <settings-dialog>
        <dialog class="m3">
            <h2 data-i18n="settings">Settings</h2>
            <div class="lang">
                <icon name="translate"/>
                <div>
                    <span data-i18n="language">Language</span>
                    <div>
                        <input type="radio" name="lang-radio" id="lang-radio-default" value="default" class="m3" checked>
                        <label for="lang-radio-default">Default</label>
                        <input type="radio" name="lang-radio" id="lang-radio-en" class="m3" value="en">
                        <label for="lang-radio-en">English</label>
                        <input type="radio" name="lang-radio" id="lang-radio-zh-CN" class="m3" value="zh-CN">
                        <label for="lang-radio-zh-CN">简体中文</label>
                    </div>
                </div>
            </div>
            <div class="buttons">
                <button data-i18n="cancel" class="m3 tonal close">Cancel</button>
                <button data-i18n="apply" class="m3 apply">Apply</button>
            </div>
        </dialog>
    </settings-dialog>
</body>
</html>
