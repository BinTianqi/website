name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - run: |
          npm install
          npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist